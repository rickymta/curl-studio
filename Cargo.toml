[workspace]
members = ["src-tauri", "crates/curlstudio-core"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["CurlStudio contributors"]

[workspace.dependencies]
curlstudio-core = { path = "crates/curlstudio-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
portable-pty = "0.9"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie_store = "0.22"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hdrhistogram = { version = "7.5", default-features = false }
hex = "0.4"
hmac = "0.12"
http = "1"
md-5 = "0.10"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "cookies", "multipart", "stream", "gzip", "brotli", "deflate", "zstd", "socks", "system-proxy", "json", "query", "form"] }
reqwest_cookie_store = "0.10"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "url"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "url"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots", "gzip"] }
tonic-reflection = "0.14"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
